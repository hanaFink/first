<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:Heebo;src:url(heebo-hebrew.woff2) format('woff2');font-weight:100 900;}
body{margin:0;font-family:Heebo}</style></head><body>
<canvas id="c"></canvas>
<script>
// Repairs a misspelled label baked into a still: fills a rotated box with paper tone
// interpolated from the box rim, then sets the corrected text at the same angle.
window.patch = async (src, P) => {
  const img = new Image(); img.src = src; await img.decode();
  await document.fonts.load(`${P.weight} ${P.size}px Heebo`, P.text);
  const c = document.getElementById('c'); c.width = img.width; c.height = img.height;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0);
  const src2 = g.getImageData(0, 0, c.width, c.height);
  const a = P.angle * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
  const toImg = (u, v) => [P.cx + u * ca - v * sa, P.cy + u * sa + v * ca];
  const sample = (u, v) => { const [x, y] = toImg(u, v); const i = (Math.round(y) * c.width + Math.round(x)) * 4;
    return [src2.data[i], src2.data[i + 1], src2.data[i + 2]]; };
  const avg = (u, v) => { let s = [0, 0, 0], n = 0; for (let du = -2; du <= 2; du++) for (let dv = -1; dv <= 1; dv++) { const p = sample(u + du, v + dv); s[0] += p[0]; s[1] += p[1]; s[2] += p[2]; n++; } return s.map(x => x / n); };
  const W = P.w / 2, H = P.h / 2, out = g.getImageData(0, 0, c.width, c.height);
  let seed = 7; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  const minx = Math.floor(P.cx - W - H - 4), maxx = Math.ceil(P.cx + W + H + 4), miny = Math.floor(P.cy - W - H - 4), maxy = Math.ceil(P.cy + W + H + 4);
  for (let y = miny; y <= maxy; y++) for (let x = minx; x <= maxx; x++) {
    const dx = x - P.cx, dy = y - P.cy, u = dx * ca + dy * sa, v = -dx * sa + dy * ca;
    if (Math.abs(u) > W + P.feather || Math.abs(v) > H + P.feather) continue;
    const fu = (u + W) / (2 * W), fv = (v + H) / (2 * H);
    const top = avg(Math.max(-W, Math.min(W, u)), -H - 2), bot = avg(Math.max(-W, Math.min(W, u)), H + 2);
    const lef = avg(-W - 3, Math.max(-H, Math.min(H, v))), rig = avg(W + 3, Math.max(-H, Math.min(H, v)));
    const cu = Math.min(1, Math.max(0, fu)), cv = Math.min(1, Math.max(0, fv));
    const wv = Math.min(cv, 1 - cv), wu = Math.min(cu, 1 - cu);           // closer rim weighs more
    const kV = wu / (wu + wv + 1e-6);
    const n = (rnd() - 0.5) * P.noise;
    const col = [0, 1, 2].map(k => (top[k] * (1 - cv) + bot[k] * cv) * kV + (lef[k] * (1 - cu) + rig[k] * cu) * (1 - kV) + n);
    // feather the edge into the original
    const e = Math.min(1, Math.min(W + P.feather - Math.abs(u), H + P.feather - Math.abs(v)) / P.feather);
    const i = (y * c.width + x) * 4;
    for (let k = 0; k < 3; k++) out.data[i + k] = out.data[i + k] * (1 - e) + col[k] * e;
  }
  g.putImageData(out, 0, 0);
  g.save(); g.translate(P.tx, P.ty); g.rotate(a); g.transform(1, 0, Math.tan(P.skew * Math.PI / 180), 1, 0, 0);
  g.filter = `blur(${P.blur}px)`; g.fillStyle = P.color; g.font = `${P.weight} ${P.size}px Heebo`;
  g.direction = 'rtl'; g.textAlign = 'right'; g.textBaseline = 'alphabetic';
  g.fillText(P.text, 0, 0); g.restore();
  return c.toDataURL('image/png');
};
</script></body></html>
