<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>Pension Net vs Gross — photo cut</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#1a140e}
#stage{position:absolute;inset:0;overflow:hidden}

/* each shot is one still; the camera move is a transform on the whole shot,
   so overlays placed inside it (sweep, glow) stay locked to the photo */
.shot{position:absolute;inset:0;opacity:0;will-change:transform,opacity,filter}
.shot img{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover}
.fx{position:absolute;pointer-events:none}

/* light sweep over the highlighted 12,000 box (shot 1) */
#sweepClip{left:52.5%;top:62.2%;width:39%;height:7.6%;overflow:hidden;border-radius:6px;mix-blend-mode:screen}
#sweep{position:absolute;top:-40%;bottom:-40%;width:38%;
  background:linear-gradient(100deg,rgba(255,250,235,0) 0%,rgba(255,250,235,.55) 50%,rgba(255,250,235,0) 100%)}

/* glow behind the question mark on the tablet (shot 3) */
#qglow{left:69.6%;top:63.6%;width:460px;height:460px;margin:-230px 0 0 -230px;border-radius:50%;mix-blend-mode:screen;
  background:radial-gradient(closest-side,rgba(205,225,255,.55),rgba(205,225,255,.18) 45%,rgba(205,225,255,0) 100%);opacity:0}

/* screen-space finishing */
#leak{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:0}
#sunbreath{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;
  background:radial-gradient(900px 1100px at 12% 10%,rgba(255,214,150,.9),rgba(255,214,150,0) 70%)}
#vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(1250px 1700px at 50% 46%,rgba(0,0,0,0) 58%,rgba(30,20,10,.32) 100%)}
canvas{position:absolute;inset:0;width:1080px;height:1920px;pointer-events:none}
#dust{mix-blend-mode:screen}
#grain{mix-blend-mode:overlay;opacity:.16}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <div class="shot" id="s1"><img src="images/s1-report.webp" alt="">
    <div class="fx" id="sweepClip"><div id="sweep"></div></div>
  </div>
  <div class="shot" id="s2"><img src="images/s2-documents.webp" alt=""></div>
  <div class="shot" id="s3"><img src="images/s3-tablet.webp" alt="">
    <div class="fx" id="qglow"></div>
  </div>
  <div class="shot" id="s4"><img src="images/s4-final-fixed.png" alt=""></div>

  <div id="sunbreath"></div>
  <div id="leak"></div>
  <canvas id="dust" width="1080" height="1920"></canvas>
  <div id="vig"></div>
  <canvas id="grain" width="540" height="960"></canvas>
  <div id="fade"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const clamp = (x,a=0,b=1) => Math.min(b,Math.max(a,x));
const lerp = (a,b,p) => a+(b-a)*p;
const prog = (t,t0,t1) => clamp((t-t0)/(t1-t0));
const eSine = p => 0.5-0.5*Math.cos(Math.PI*p);
const eOut = p => 1-Math.pow(1-p,3);
const eIO = p => p<.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2;
function rng(seed){ return () => (seed = (seed*16807) % 2147483647) / 2147483647; }

/* shots: cut point (in), next cut (out), camera move (scale, focal point %, drift px).
   Text is baked into the photos, so two legible frames are never mixed: the dissolve happens
   only while both shots are deep in blur. A shared push-in carries momentum through each cut. */
const T = 0.6, MAXBLUR = 22, PUSH = 0.07, XH = 0.18;
const SHOTS = [
  {id:'s1', cin:0.0,  cout:4.0,  s:[1.00,1.07],  o:[68,66], dx:[0,-6],  dy:[0,-4]},   // push-in on 12,000
  {id:'s2', cin:4.0,  cout:8.0,  s:[1.08,1.035], o:[50,52], dx:[12,-12],dy:[0,0]},    // widen + slow lateral
  {id:'s3', cin:8.0,  cout:11.0, s:[1.02,1.08],  o:[66,62], dx:[8,0],   dy:[6,0]},    // glide in to the tablet
  {id:'s4', cin:11.0, cout:99,   s:[1.09,1.00],  o:[50,42], dx:[0,0],   dy:[-10,0], settle:true}, // pull back, settle, hold
];
const eInQ = p => p*p*p, eOutQ = p => 1-Math.pow(1-p,3);
// mostly linear so the camera never stops dead at a cut; sine adds a soft start/finish
const glide = p => 0.65*p + 0.35*eSine(p);

function shot(t, sh, idx){
  const el=$(sh.id);
  const first = idx===0, last = idx===SHOTS.length-1;
  const t0 = first ? 0 : sh.cin-XH-0.02, t1 = last ? 15 : sh.cout+XH+0.02;
  if(t<t0 || t>t1){ el.style.opacity=0; return; }
  const a0 = first ? 0 : sh.cin-T, a1 = last ? 15 : sh.cout+T;
  const p = sh.settle ? eOut(clamp(prog(t,a0,a1)*1.25)) : glide(prog(t,a0,a1));
  // push-in through the cut: outgoing accelerates in, incoming continues and eases out
  const pushOut = last  ? 0 : PUSH*eInQ(prog(t, sh.cout-T, sh.cout+XH));
  const pushIn  = first ? 0 : PUSH*(1-eOutQ(prog(t, sh.cin-XH, sh.cin+T)));
  const s = lerp(sh.s[0],sh.s[1],p) * (1+pushOut+pushIn);
  const dx = lerp(sh.dx[0],sh.dx[1],p), dy = lerp(sh.dy[0],sh.dy[1],p);
  const fx = 1.4*Math.sin(t*0.8+sh.cin), fy = 1.0*Math.sin(t*0.6+sh.cin*2);   // slider float
  el.style.transformOrigin = `${sh.o[0]}% ${sh.o[1]}%`;
  el.style.transform = `translate(${(dx+fx).toFixed(2)}px,${(dy+fy).toFixed(2)}px) scale(${s.toFixed(5)})`;
  const opIn   = first ? 1 : eIO(prog(t, sh.cin-XH, sh.cin+XH));
  const blurIn = first ? 0 : MAXBLUR*(1-eIO(prog(t, sh.cin, sh.cin+T)));
  const blurOut= last  ? 0 : MAXBLUR*eIO(prog(t, sh.cout-T, sh.cout));
  const blur = Math.max(blurIn, blurOut);
  el.style.opacity = opIn.toFixed(4);
  el.style.zIndex = idx+1;
  el.style.filter = (blur>0.05 ? `blur(${blur.toFixed(2)}px) ` : '') + `brightness(${(1+0.06*blur/MAXBLUR).toFixed(3)})`;
}

/* soft warm glow drifting across each transition */
function leak(t){
  let a=0, x=50;
  for(const tc of [4.0,8.0,11.0]){
    const p=prog(t,tc-0.65,tc+0.65);
    if(p>0 && p<1){ a=Math.pow(Math.sin(Math.PI*p),2)*0.32; x=lerp(5,75,eSine(p)); }
  }
  const el=$('leak');
  el.style.opacity=a.toFixed(3);
  el.style.background=`radial-gradient(1000px 1600px at ${x}% 32%,rgba(255,210,150,.7),rgba(255,190,120,.22) 50%,rgba(255,190,120,0) 80%)`;
}

/* dust motes drifting in the window light (upper-left) */
const MOTES=(()=>{const r=rng(9),a=[];for(let i=0;i<70;i++)a.push({x:r()*1080,y:r()*1300,s:.8+r()*2.4,vx:3+r()*9,vy:-2-r()*6,ph:r()*6.28,f:.4+r()*.8,a:.2+r()*.5});return a;})();
function dust(t){
  const g=$('dust').getContext('2d'); g.clearRect(0,0,1080,1920);
  for(const m of MOTES){
    const x=(m.x+m.vx*t+12*Math.sin(t*m.f+m.ph))%1120-20, y=((m.y+m.vy*t)%1340+1340)%1340-20;
    const beam=clamp(1.2-x/800)*clamp(1.25-y/1150);
    const a=m.a*beam*(0.6+0.4*Math.sin(t*2*m.f+m.ph*3));
    if(a<0.01) continue;
    const rad=m.s*3, grd=g.createRadialGradient(x,y,0,x,y,rad);
    grd.addColorStop(0,`rgba(255,244,222,${a})`); grd.addColorStop(1,'rgba(255,244,222,0)');
    g.fillStyle=grd; g.beginPath(); g.arc(x,y,rad,0,6.283); g.fill();
  }
}

/* fine film grain, new pattern every frame, deterministic per frame */
function grain(t){
  const c=$('grain'), g=c.getContext('2d'), img=g.createImageData(540,960), d=img.data;
  const r=rng(1+Math.round(t*30)*7919);
  for(let i=0;i<d.length;i+=4){ const v=118+(r()-0.5)*120; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; }
  g.putImageData(img,0,0);
}

function render(t){
  SHOTS.forEach((sh,i)=>shot(t,sh,i));

  // shot 1: specular sweep across the highlighted figure, right to left (RTL reading)
  const sp=eSine(prog(t,0.55,1.55));
  $('sweep').style.left = lerp(105,-45,sp).toFixed(2)+'%';
  $('sweepClip').style.opacity = (sp>0 && sp<1) ? 1 : 0;

  // shot 3: the question mark gains a soft luminous glow
  const gq = eOut(prog(t,8.85,9.5)) * (0.75+0.25*Math.sin(Math.PI*prog(t,9.5,10.7)));
  $('qglow').style.opacity = gq.toFixed(3);

  // light: gentle breathing; warmer and calmer at the end
  const resolve=eSine(prog(t,11.0,12.6));
  $('sunbreath').style.opacity=(0.10+0.04*Math.sin(t*1.3)+0.10*resolve).toFixed(3);

  leak(t); dust(t); grain(t);
  $('fade').style.opacity = (1-eOut(prog(t,0,0.35))).toFixed(3);   // open from black
}
window.render=render;
window.sceneReady=Promise.all([...document.images].map(i=>i.decode())).then(()=>render(0));
</script>
</body>
</html>
